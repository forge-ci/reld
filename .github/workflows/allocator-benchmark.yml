name: Soldrix queue prefetch smoke

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Workload profile requested by the job
        required: true
        type: choice
        options: [go, rust, rust-fresh]
      verify_ram_cache:
        description: Verify the fresh Rust compiler cache is on tmpfs and reusable
        default: false
        type: boolean
      verify_ram_assets:
        description: Verify asset restore and publication on the bounded tmpfs
        default: false
        type: boolean

permissions: {}

jobs:
  profile-smoke:
    if: github.ref == 'refs/heads/test/soldrix-prefetch-wire'
    runs-on:
      - self-hosted
      - dell-jw22zc3
      - forge-dispatch
      - soldrix-prefetch-${{ inputs.profile }}
    timeout-minutes: 3
    steps:
      - name: Verify the selected workload fixture
        shell: bash
        env:
          PROFILE: ${{ inputs.profile }}
          VERIFY_RAM_CACHE: ${{ inputs.verify_ram_cache }}
          VERIFY_RAM_ASSETS: ${{ inputs.verify_ram_assets }}
        run: |
          set -euo pipefail
          test -d "$SOLDRIX_WORKSPACE"
          if [[ "$VERIFY_RAM_ASSETS" == true ]]; then
            assets=/var/cache/obs-runner/assets
            test "$(stat -f -c %T "$assets")" = tmpfs
            test "$(stat -c %a "$assets")" = 1777
            restored=$(find "$assets" -maxdepth 1 -type f -size +100M -print -quit)
            test -n "$restored"
            test "$(sha256sum "$restored" | cut -d ' ' -f 1)" = "${restored##*/}"
            pending=$(mktemp "$assets/.soldrix-canary.XXXXXXXX.part")
            printf 'soldrix RAM asset canary %s\n' "$GITHUB_RUN_ID" > "$pending"
            hash=$(sha256sum "$pending" | cut -d ' ' -f 1)
            chmod 0644 "$pending"
            mv "$pending" "$assets/$hash"
            printf 'shared_asset_cache=tmpfs restored_and_published=true\n'
          fi
          case "$PROFILE" in
            go)
              cd "$SOLDRIX_WORKSPACE/.mixed-test"
              export PATH="/usr/local/go/bin:$PATH"
              export GOCACHE="$PWD/cache" GOPATH="$PWD/gopath" GOENV=off GOWORK=off GOTOOLCHAIN=local
              export GOPROXY=off GOSUMDB=off
              test -f "$GOCACHE/README"
              printf 'package main\nimport "fmt"\nfunc main() { fmt.Println("soldrix-prefetch-go") }\n' > queue-smoke.go
              go build -trimpath -o queue-smoke queue-smoke.go
              test "$(./queue-smoke)" = soldrix-prefetch-go
              ;;
            rust)
              test -r "$SOLDRIX_WORKSPACE/.soldrix-build/project/target/debug/libsoldr_core.rlib"
              ;;
            rust-fresh)
              fixture="$SOLDRIX_WORKSPACE/.soldrix-build"
              cd "$fixture/project"
              root="$(mktemp -d "$PWD/.queue-fresh.XXXXXXXX")"
              export HOME="$root" PATH="$fixture/bin:$PATH"
              export RUSTUP_HOME="$root/rustup" RUSTUP_TOOLCHAIN=1.98.1 RUSTUP_AUTO_INSTALL=0
              export CARGO_HOME="$PWD/.ci-cargo" CARGO_TARGET_DIR="$root/target" TMPDIR="$root/tmp"
              export SOLDR_LINKER=default SOLDR_NATIVE_CACHE=0 SOLDR_TARGET_AUTO_PRUNE_ENABLED=0
              unset SOLDR_RUSTC_WRAPPER SOLDR_BROKER_AUTOSPAWN ZCCACHE_DISABLE
              export SOLDR_PATH_REMAP=off SOLDR_CACHE_DIR="$root/compiler-cache"
              export XDG_CONFIG_HOME="$root/config"
              if [[ "$VERIFY_RAM_CACHE" == true ]]; then
                test "$(stat -f -c %T /opt/forge/soldr)" = tmpfs
                test "$(stat -f -c %T /var/cache/obs-runner)" = tmpfs
                cache="/opt/forge/soldr/soldrix-ram-canary-$GITHUB_RUN_ID"
                mkdir -m 0700 "$cache"
                export SOLDR_CACHE_DIR="$cache/compiler-cache"
              fi
              mkdir -p "$RUSTUP_HOME/toolchains" "$TMPDIR" "$XDG_CONFIG_HOME"
              ln -s "$PWD/.ci-toolchain" "$RUSTUP_HOME/toolchains/1.98.1-x86_64-unknown-linux-gnu"
              test ! -e "$CARGO_TARGET_DIR"
              test ! -e "$SOLDR_CACHE_DIR"
              started=$SECONDS
              soldr cargo build --locked --offline -p soldr-core --message-format=json > "$root/build.jsonl"
              test -s "$CARGO_TARGET_DIR/debug/libsoldr_core.rlib"
              python3 -c 'import json,sys; assert any(row.get("reason")=="compiler-artifact" and row["target"]["name"]=="soldr_core" and not row["fresh"] for row in map(json.loads, (line for line in sys.stdin if line.startswith("{"))))' < "$root/build.jsonl"
              printf 'fresh_rust_build_s=%s\n' "$((SECONDS - started))"
              if [[ "$VERIFY_RAM_CACHE" == true ]]; then
                export CARGO_TARGET_DIR="$root/reused-target"
                test ! -e "$CARGO_TARGET_DIR"
                started=$SECONDS
                soldr cargo build --locked --offline -p soldr-core --message-format=json > "$root/reuse.jsonl"
                test -s "$CARGO_TARGET_DIR/debug/libsoldr_core.rlib"
                printf '%s\n' "$GITHUB_RUN_ID" > "$cache/persisted-run"
                printf 'reused_rust_build_s=%s\n' "$((SECONDS - started))"
              fi
              ;;
            *) exit 2 ;;
          esac
          printf 'workload=%s runner=%s\n' "$PROFILE" "$RUNNER_NAME"
