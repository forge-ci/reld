name: Stress

# Randomized end-to-end link stress: generate a workload, compile it, link it with the
# linker under test, run it, and check the exit code.
#
# The exit-code oracle is the reason this exists. A linker that mis-resolves a symbol
# produces a binary that links cleanly and then behaves wrong; a crash-only test never
# sees it.

# Cost deferral: not on pull_request. The PR/merge queue is Linux-only (`CI summary`);
# this lane runs on push to main, nightly/weekly schedule, and workflow_dispatch.
on:
  workflow_dispatch:
    inputs:
      seeds:
        description: "Number of seeds to run"
        required: false
        default: "500"
      forge_pool:
        description: "RUN-005 canary: use the forge pool even while FORGE_POOL_LABELS is unset"
        type: boolean
        default: false
  schedule:
    # Nightly, offset off the hour to avoid the Actions rush.
    - cron: "23 7 * * *"
  push:
    branches: [main]
    paths:
      - "crates/reld-testkit/**"
      - ".github/workflows/stress.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Forge pool (forge-ci/gh-runner docs/pool.md): picks the self-hosted Dell
  # pool for the Linux stress legs when the repo variable FORGE_POOL_LABELS is set
  # and the pool has an idle runner, else hosted. pool-select keeps fork PRs
  # and pull_request_target hosted (trusted-only, the default). Unset
  # FORGE_POOL_LABELS to send the job back to hosted at once.
  pool:
    name: Select runner
    # Skipped while routing is off: the job below then runs hosted.
    if: vars.FORGE_POOL_LABELS != '' || inputs.forge_pool
    # forge-quick through the kill switch (RUN-004).
    runs-on: ${{ vars.FORGE_QUICK_LABELS != '' && fromJSON(vars.FORGE_QUICK_LABELS) || 'ubuntu-24.04' }}
    timeout-minutes: 2
    permissions: {}
    outputs:
      runs-on: ${{ steps.select.outputs.runs-on || '"ubuntu-24.04"' }}
    steps:
      - name: Select pool or hosted
        id: select
        continue-on-error: true
        uses: forge-ci/ci.yml/actions/pool-select@a36bc81ad6ada5fb17398e3e7ba38435cc67a951 # ci.yml#550, tokenless signal source
        with:
          # The variable is the kill switch; a manual `forge_pool` dispatch
          # proves one real job on the pool before the variable is set.
          labels: ${{ vars.FORGE_POOL_LABELS || (inputs.forge_pool && '["self-hosted","forge-pool"]' || '') }}
          fallback: ubuntu-24.04

  stress:
    name: ${{ matrix.os }} / ${{ matrix.linker || 'default' }}
    needs: pool
    # Runs when the selector was skipped (routing off) or failed, too: the
    # Linux legs then run hosted. Only they can use the pool.
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.os == 'ubuntu-24.04' && fromJSON(needs.pool.outputs.runs-on || '"ubuntu-24.04"') || matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # The inherited linker emits ELF only, so it is Linux-only by construction.
          - os: ubuntu-24.04
            linker: lld
          - os: ubuntu-24.04
            linker: bfd
          - os: ubuntu-24.04
            linker: mold
          - os: windows-2022
            linker: lld
          - os: macos-15
            linker: ""
    steps:
      - uses: actions/checkout@v4

      - name: Install linkers (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang lld mold

      - name: Install LLVM (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: choco install llvm --no-progress -y

      - uses: dtolnay/rust-toolchain@18f0487477426dce244608110aa2660c2893deb7 # 1.98.1

      - name: Build stress harness
        run: cargo build --release --bin reld-stress

      - name: Run stress
        shell: bash
        env:
          SEEDS: ${{ github.event.inputs.seeds || (github.event_name == 'push' && '60' || '500') }}
        run: |
          set -euo pipefail
          args=(--seeds "$SEEDS")
          if [ -n "${{ matrix.linker }}" ]; then
            args+=(--linker "${{ matrix.linker }}")
          fi
          cargo run --release --bin reld-stress -- "${args[@]}"

      - name: Upload failing trees
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: stress-failures-${{ matrix.os }}-${{ matrix.linker || 'default' }}
          # reld-stress deliberately does not clean up a failing seed's tree.
          path: |
            ${{ runner.temp }}/reld-stress/**
            /tmp/reld-stress/**
          if-no-files-found: ignore
